# AQ5 relevance benchmark partition overlay (#1009)
# Adopts ADR-0005 golden_v1 + golden_v2_clap query IDs into CALIBRATION / TEST.
# Do not tune thresholds or labels using TEST/HOLDOUT query keys.
benchmark_id: sample-brain.aq5.relevance.adr0005-golden.v1
benchmark_version: "1.0.0"
document_type: sample-brain.aq5.relevance-benchmark.v1
notes: >
  CALIBRATION maps to KPI DEVELOPMENT/CALIBRATION; TEST maps to TEST/HOLDOUT.
  Composite query identity is suite:query_id (tier_a:… / tier_b:…).
  Vocal proxy spike suite is excluded (HOLD) and must not appear here.

