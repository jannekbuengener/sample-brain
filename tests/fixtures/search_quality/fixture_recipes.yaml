version: 1
contract_version: 1
notes: >
  Machine-readable Tier-B fixture recipes for vocal_no_vocal and genre_mood (#215).
  All fixtures are fully procedural; no third-party audio. WAV files are generated
  at runtime only. Genre/mood labels are evaluation hypotheses, not objective truths.
defaults:
  sample_rate: 48000
  bit_depth: 16
  channels: 1
  origin: fully_procedural
  no_third_party_audio: true
recipes:
  vocal-formant-a:
    fixture_id: vocal-formant-a
    query_class: vocal_no_vocal
    semantic_subclass: synthetic_vocal_proxy
    fixture_type: formant_tone
    role: positive_candidate
    duration_sec: 4.0
    seed: 21501
    fixture_params:
      f0_hz: 150.0
      formants_hz: [700.0, 1220.0, 2600.0]
      bandwidth_q: 8.0
    expected_filename: vocal-formant-a.wav
    audio_properties:
      sample_rate: 48000
      channels: 1
      non_silent: true
      no_clipping: true
    semantic_limits: >
      Formant-harmonic proxy only; not real speech or singing.
  vocal-formant-b:
    fixture_id: vocal-formant-b
    query_class: vocal_no_vocal
    semantic_subclass: synthetic_vocal_proxy_vibrato
    fixture_type: formant_tone
    role: positive_candidate
    duration_sec: 4.0
    seed: 21502
    fixture_params:
      f0_hz: 165.0
      formants_hz: [500.0, 1700.0, 2500.0]
      bandwidth_q: 8.0
      vibrato_hz: 5.0
