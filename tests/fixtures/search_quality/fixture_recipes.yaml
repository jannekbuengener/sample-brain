    expected_filename: vocal-vowel-a.wav
    audio_properties:
      sample_rate: 48000
      channels: 1
      non_silent: true
      no_clipping: true
    semantic_limits: >
      Sustained vowel-like pad; not recorded speech.
  no-vocal-chord-a:
