version: 1
tier: B
phase: 1
embedding_dim: 512
notes: >
  Phase 1 covers query classes kick_snare_perc and pad_texture only.
  Synthetic fixtures are generated at benchmark time; no audio is committed.
defaults:
  topk: 10
  model_id: 1
  backend: clap
thresholds:
  mean_precision_at_5: 0.20
  mean_recall_at_10: 0.30
catalog:
  samples:
    - id: 1
      fixture_name: kick-a
      fixture_type: kick_transient
      fixture_params: {bpm: 120}
      duration: 4.0
      pred_type: kick
      sample_class: kick_snare_perc
      tags: [kick, drum]
    - id: 2
      fixture_name: kick-b
      fixture_type: kick_transient
      fixture_params: {bpm: 128}
      duration: 4.0
      pred_type: kick
      sample_class: kick_snare_perc
      tags: [kick]
    - id: 3
      fixture_name: kick-c
      fixture_type: kick_transient
      fixture_params: {bpm: 140}
      duration: 4.0
      pred_type: kick
      sample_class: kick_snare_perc
      tags: [kick, drum]
    - id: 4
      fixture_name: snare-a
      fixture_type: pulse_train
      fixture_params: {bpm: 120}
      duration: 4.0
      pred_type: snare
      sample_class: kick_snare_perc
      tags: [snare, drum]
    - id: 5
      fixture_name: snare-b
      fixture_type: pulse_train
      fixture_params: {bpm: 128}
      duration: 4.0
      pred_type: snare
      sample_class: kick_snare_perc
      tags: [snare]
    - id: 6
      fixture_name: perc-a
      fixture_type: perc_hit
      duration: 0.5
      pred_type: percussion
      sample_class: kick_snare_perc
      tags: [perc, hit]
    - id: 7
      fixture_name: pad-a
      fixture_type: sine_tone
      fixture_params: {frequency_hz: 220}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad, synth]
    - id: 8
      fixture_name: pad-b
      fixture_type: sine_tone
      fixture_params: {frequency_hz: 330}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad]
    - id: 9
      fixture_name: pad-c
      fixture_type: sine_tone
      fixture_params: {frequency_hz: 440}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad, synth]
    - id: 10
      fixture_name: chord-a
      fixture_type: chord_pad
      fixture_params: {root: A}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad, chord]
    - id: 11
      fixture_name: chord-b
      fixture_type: chord_pad
      fixture_params: {root: D}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad, chord]
    - id: 12
      fixture_name: texture-a
      fixture_type: texture_noise
      fixture_params: {seed: 42}
      duration: 4.0
      pred_type: texture
      sample_class: pad_texture
      tags: [texture, ambient]
queries:
  - id: kick_text_basic
    mode: text
    query_class: kick_snare_perc
    text: kick drum
    relevant_sample_ids: [1, 2, 3]
    negative_sample_ids: [7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: kick_text_low
    mode: text
    query_class: kick_snare_perc
    text: bass drum hit
    relevant_sample_ids: [1, 2, 3]
    negative_sample_ids: [7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: snare_text_basic
    mode: text
    query_class: kick_snare_perc
    text: snare drum
    relevant_sample_ids: [4, 5]
    negative_sample_ids: [1, 2, 3, 7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: perc_text_basic
    mode: text
    query_class: kick_snare_perc
    text: percussion hit
    relevant_sample_ids: [6]
    negative_sample_ids: [7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: pad_text_warm
    mode: text
    query_class: pad_texture
    text: warm pad synth
    relevant_sample_ids: [7, 8, 9]
    negative_sample_ids: [1, 2, 3, 4, 5, 6]
    must_recall_within_k: 10
  - id: pad_text_ambient
    mode: text
    query_class: pad_texture
    text: ambient texture sound
    relevant_sample_ids: [10, 11, 12]
    negative_sample_ids: [1, 2, 3, 4, 5, 6]
    must_recall_within_k: 10
  - id: kick_audio_ref
    mode: audio
    query_class: kick_snare_perc
    query_audio_fixture: kick-a
    relevant_sample_ids: [1, 2, 3]
    negative_sample_ids: [7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: snare_audio_ref
    mode: audio
    query_class: kick_snare_perc
    query_audio_fixture: snare-a
    relevant_sample_ids: [4, 5]
    negative_sample_ids: [1, 2, 3, 7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: pad_audio_ref
    mode: audio
    query_class: pad_texture
    query_audio_fixture: pad-a
    relevant_sample_ids: [7, 8, 9]
    negative_sample_ids: [1, 2, 3, 4, 5, 6]
    must_recall_within_k: 10
  - id: texture_audio_ref
    mode: audio
    query_class: pad_texture
    query_audio_fixture: texture-a
    relevant_sample_ids: [10, 11, 12]
    negative_sample_ids: [1, 2, 3, 4, 5, 6]
    must_recall_within_k: 10
