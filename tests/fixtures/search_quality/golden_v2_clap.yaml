version: 1
tier: B
phase: 2
phases_covered: [1, 2]
embedding_dim: 512
notes: >
  Phase 1: kick_snare_perc and pad_texture.
  Phase 2: riser_impact and dry_wet (dry_wet included after CLAP spike PASS).
  Synthetic fixtures are generated at benchmark time; no audio is committed.
defaults:
  topk: 10
  model_id: 1
  backend: clap
thresholds:
  mean_precision_at_5: 0.20
  mean_recall_at_10: 0.30
catalog:
  samples:
    - id: 1
      fixture_name: kick-a
      fixture_type: kick_transient
      fixture_params: {bpm: 120}
      duration: 4.0
      pred_type: kick
      sample_class: kick_snare_perc
      tags: [kick, drum]
    - id: 2
      fixture_name: kick-b
      fixture_type: kick_transient
      fixture_params: {bpm: 128}
      duration: 4.0
      pred_type: kick
      sample_class: kick_snare_perc
      tags: [kick]
    - id: 3
      fixture_name: kick-c
      fixture_type: kick_transient
      fixture_params: {bpm: 140}
      duration: 4.0
      pred_type: kick
      sample_class: kick_snare_perc
      tags: [kick, drum]
    - id: 4
      fixture_name: snare-a
      fixture_type: pulse_train
      fixture_params: {bpm: 120}
      duration: 4.0
      pred_type: snare
      sample_class: kick_snare_perc
      tags: [snare, drum]
    - id: 5
      fixture_name: snare-b
      fixture_type: pulse_train
      fixture_params: {bpm: 128}
      duration: 4.0
      pred_type: snare
      sample_class: kick_snare_perc
      tags: [snare]
    - id: 6
      fixture_name: perc-a
      fixture_type: perc_hit
      duration: 0.5
      pred_type: percussion
      sample_class: kick_snare_perc
      tags: [perc, hit]
    - id: 7
      fixture_name: pad-a
      fixture_type: sine_tone
      fixture_params: {frequency_hz: 220}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad, synth]
    - id: 8
      fixture_name: pad-b
      fixture_type: sine_tone
      fixture_params: {frequency_hz: 330}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad]
    - id: 9
      fixture_name: pad-c
      fixture_type: sine_tone
      fixture_params: {frequency_hz: 440}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad, synth]
    - id: 10
      fixture_name: chord-a
      fixture_type: chord_pad
      fixture_params: {root: A}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad, chord]
    - id: 11
      fixture_name: chord-b
      fixture_type: chord_pad
      fixture_params: {root: D}
      duration: 4.0
      pred_type: pad
      sample_class: pad_texture
      tags: [pad, chord]
    - id: 12
      fixture_name: texture-a
      fixture_type: texture_noise
      fixture_params: {seed: 42}
      duration: 4.0
      pred_type: texture
      sample_class: pad_texture
      tags: [texture, ambient]
    - id: 13
      fixture_name: riser-a
      fixture_type: freq_sweep_riser
      fixture_params: {duration_sec: 4.0, start_hz: 200, end_hz: 3000, curve: exponential}
      duration: 4.0
      pred_type: fx
      sample_class: riser_impact
      tags: [riser, sweep]
    - id: 14
      fixture_name: riser-b
      fixture_type: freq_sweep_riser
      fixture_params: {duration_sec: 3.0, start_hz: 150, end_hz: 5000, curve: exponential}
      duration: 3.0
      pred_type: fx
      sample_class: riser_impact
      tags: [riser, build]
    - id: 15
      fixture_name: riser-c
      fixture_type: freq_sweep_riser
      fixture_params: {duration_sec: 2.5, start_hz: 300, end_hz: 4000, curve: linear}
      duration: 2.5
      pred_type: fx
      sample_class: riser_impact
      tags: [riser, whoosh]
    - id: 16
      fixture_name: impact-a
      fixture_type: impact_hit
      fixture_params: {decay_sec: 0.4, noise_seed: 11}
      duration: 0.4
      pred_type: impact
      sample_class: riser_impact
      tags: [impact, hit]
    - id: 17
      fixture_name: impact-b
      fixture_type: impact_hit
      fixture_params: {decay_sec: 0.6, noise_seed: 17}
      duration: 0.6
      pred_type: impact
      sample_class: riser_impact
      tags: [impact, boom]
    - id: 18
      fixture_name: impact-c
      fixture_type: impact_hit
      fixture_params: {decay_sec: 0.8, noise_seed: 23}
      duration: 0.8
      pred_type: impact
      sample_class: riser_impact
      tags: [impact, cinematic]
    - id: 19
      fixture_name: kick-dry-a
      fixture_type: kick_transient
      fixture_params: {bpm: 120}
      duration: 4.0
      pred_type: kick
      sample_class: dry_wet
      tags: [kick, dry]
    - id: 20
      fixture_name: kick-wet-a
      fixture_type: wet_reverb
      fixture_params:
        base_fixture_type: kick_transient
        base_params: {bpm: 120}
        duration_sec: 4.0
        ir_decay_sec: 2.0
        mix: 0.75
        seed: 201
      duration: 4.0
      pred_type: kick
      sample_class: dry_wet
      tags: [kick, wet, reverb]
    - id: 21
      fixture_name: pad-dry-a
      fixture_type: sine_tone
      fixture_params: {frequency_hz: 220}
      duration: 4.0
      pred_type: pad
      sample_class: dry_wet
      tags: [pad, dry]
    - id: 22
      fixture_name: pad-wet-a
      fixture_type: wet_reverb
      fixture_params:
        base_fixture_type: sine_tone
        base_params: {frequency_hz: 220}
        duration_sec: 4.0
        ir_decay_sec: 2.5
        mix: 0.7
        seed: 202
      duration: 4.0
      pred_type: pad
      sample_class: dry_wet
      tags: [pad, wet, reverb]
    - id: 23
      fixture_name: perc-dry-a
      fixture_type: perc_hit
      duration: 0.5
      pred_type: percussion
      sample_class: dry_wet
      tags: [perc, dry]
    - id: 24
      fixture_name: perc-wet-a
      fixture_type: wet_reverb
      fixture_params:
        base_fixture_type: perc_hit
        base_params: {duration_sec: 0.08}
        duration_sec: 2.0
        ir_decay_sec: 1.8
        mix: 0.8
        seed: 203
      duration: 2.0
      pred_type: percussion
      sample_class: dry_wet
      tags: [perc, wet, reverb]
queries:
  - id: kick_text_basic
    mode: text
    query_class: kick_snare_perc
    text: kick drum
    relevant_sample_ids: [1, 2, 3]
    negative_sample_ids: [7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: kick_text_low
    mode: text
    query_class: kick_snare_perc
    text: bass drum hit
    relevant_sample_ids: [1, 2, 3]
    negative_sample_ids: [7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: snare_text_basic
    mode: text
    query_class: kick_snare_perc
    text: snare drum
    relevant_sample_ids: [4, 5]
    negative_sample_ids: [1, 2, 3, 7, 8, 9, 10, 11, 12]
    must_recall_within_k: 10
  - id: perc_text_basic
