name: 1121 ownership green

on:
  push:
    branches:
      - feat/1121-layout-lock-ux

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/1121-layout-lock-ux
          fetch-depth: 0
      - name: Add ownership regression test
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_workbench_layout_lock_1121.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "DropArea" not in block\n'
          new = old + '    assert "checkable: true" not in block\n' + '    assert "checked:" not in block\n'
          if text.count(old) != 1:
              raise SystemExit("test anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10" "ruff==0.16.0"
      - name: Prove repair RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_workbench_layout_lock_1121.py::test_layout_lock_control_does_not_prebuild_panel_drag_or_drop_targets
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Apply ownership repair
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/workbench_qml.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '                            checkable: true\n'
              '                            checked: window.interaction.workspacePanelDockingEnabled\n'
              '                                && !window.interaction.workspaceLayoutLocked\n'
              '                            enabled: window.interaction.workspacePanelDockingEnabled\n'
          )
          new = '                            enabled: window.interaction.workspacePanelDockingEnabled\n'
          if text.count(old) != 1:
              raise SystemExit("QML ownership anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: GREEN regressions
        run: |
          python -m pytest -q \
            tests/test_workbench_layout_lock_1121.py \
            tests/test_workbench_edit_docking_1070.py \
            tests/test_workbench_feature_settings_910.py \
            tests/test_program_chrome_qml_831.py \
            tests/test_program_chrome_slim_polish_880.py \
            tests/test_workbench_live_kit_edit_1077.py
          python -m ruff check src/workbench_qml.py tests/test_workbench_layout_lock_1121.py
          git diff --check
      - name: Commit GREEN and remove workflow
        run: |
          rm -f .github/workflows/1121-ownership-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(#1121): keep layout lock state Python-owned"
          git push origin HEAD:feat/1121-layout-lock-ux
