name: Core pytest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbench-transport:
    name: Workbench transport tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Run deterministic Workbench transport gate
        run: |
          python -m pytest -q \
            tests/test_session_grid.py \
            tests/test_workbench_transport_adapter_regression.py \
            tests/test_workbench_transport_ui.py \
            tests/test_workbench_tempo_sync_grid.py \
            tests/test_workbench_preview.py \
            tests/test_haeftig.py \
            tests/test_haeftig_workbench.py \
            tests/test_recording_take.py \
            tests/test_workbench_recording_runtime.py

  arrangement-clap:
    name: Arrangement CLAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Run optional CLAP arrangement contract tests
        run: python -m pytest -q tests/test_arrangement_clap.py

  search-quality-exit:
    name: Search quality exit regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Run search-quality exit regression
        run: python -m pytest -q tests/test_issue394_search_quality_exit.py
