name: Core pytest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbench-transport:
    name: Workbench transport tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Run deterministic Workbench transport gate
        run: |
          python -m pytest -q \
            tests/test_session_grid.py \
            tests/test_workbench_transport_adapter_regression.py \
            tests/test_workbench_transport_ui.py \
            tests/test_workbench_tempo_sync_grid.py \
            tests/test_workbench_preview.py
