name: Repair #1122 verified regression

on:
  push:
    branches: [feat/1121-layout-lock-ux]
    paths:
      - .github/workflows/diagnose-1122-pytest.yml

permissions:
  contents: write

concurrency:
  group: repair-1122-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Apply minimal QML shell repair
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Apply minimal verified repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/workbench_qml.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '"Unlock Edit layout"': '"Unlock workspace layout"',
              '"Lock Edit layout"': '"Lock workspace layout"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused RED is GREEN
        shell: bash
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_workbench_qml_production_shell.py::test_production_shell_owns_the_shared_renderer_and_minimal_chrome \
            tests/test_workbench_layout_lock_1121.py

      - name: Remove temporary diagnostics and commit repair
        shell: bash
        run: |
          git rm diagnostics/1122/pytest-first-failure.txt
          git rm .github/workflows/diagnose-1122-pytest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workbench_qml.py
          git commit -m "fix(#1121): keep mode label out of shell chrome"
          git push origin HEAD:feat/1121-layout-lock-ux
