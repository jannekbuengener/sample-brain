name: Diagnose #1122 pytest failure

on:
  push:
    branches: [feat/1121-layout-lock-ux]
    paths:
      - .github/workflows/diagnose-1122-pytest.yml

permissions:
  contents: write

concurrency:
  group: diagnose-1122-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Extract existing full-suite failure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract compact root-cause evidence from first diagnostic commit
        shell: bash
        run: |
          git show 0a85cbbd21d1a675afc6b2ccae882995ef0f947d:diagnostics/1122/pytest-first-failure.txt > "$RUNNER_TEMP/full.log"
          python - <<'PY'
          from pathlib import Path

          source = Path("/home/runner/work/_temp/full.log")
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          out = ["source_commit=0a85cbbd21d1a675afc6b2ccae882995ef0f947d"]

          marker = next((i for i, line in enumerate(lines) if " FAILURES " in line), None)
          if marker is not None:
              out.append("\n[FAILURE_HEAD]")
              out.extend(lines[marker:marker + 90])

          failed = [line for line in lines if line.startswith("FAILED ")]
          if failed:
              out.append("\n[FAILED_SUMMARY]")
              out.extend(failed[:10])

          errors = [line for line in lines if line.startswith("E   ")]
          if errors:
              out.append("\n[ASSERTION_LINES]")
              out.extend(errors[:30])

          Path("diagnostics/1122/pytest-first-failure.txt").write_text(
              "\n".join(out) + "\n", encoding="utf-8"
          )
          PY

      - name: Persist root-cause slice on PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/1122/pytest-first-failure.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(diagnostics): isolate #1122 pytest root cause [skip ci]"
            git push origin HEAD:feat/1121-layout-lock-ux
          fi
