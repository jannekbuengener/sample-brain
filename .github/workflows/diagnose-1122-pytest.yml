name: Diagnose #1122 pytest failure

on:
  push:
    branches: [feat/1121-layout-lock-ux]
    paths:
      - .github/workflows/diagnose-1122-pytest.yml

permissions:
  contents: write

concurrency:
  group: diagnose-1122-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture first full-suite failure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Verify Tk can start under virtual display
        run: xvfb-run -a python -c "import tkinter as tk; root = tk.Tk(); root.destroy()"

      - name: Capture first failing test
        id: pytest
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m pytest -q tests --maxfail=1 --tb=short > "$RUNNER_TEMP/pytest-first-failure.log" 2>&1
          status=$?
          set -e
          echo "pytest_exit=$status" >> "$GITHUB_OUTPUT"

      - name: Persist compact diagnostic evidence on PR branch
        shell: bash
        env:
          PYTEST_EXIT: ${{ steps.pytest.outputs.pytest_exit }}
        run: |
          mkdir -p diagnostics/1122
          {
            echo "source_head=$GITHUB_SHA"
            echo "pytest_exit=$PYTEST_EXIT"
            echo
            tail -n 300 "$RUNNER_TEMP/pytest-first-failure.log"
          } > diagnostics/1122/pytest-first-failure.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/1122/pytest-first-failure.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(diagnostics): capture compact #1122 pytest failure [skip ci]"
            git push origin HEAD:feat/1121-layout-lock-ux
          fi

      - name: Preserve pytest result
        shell: bash
        env:
          PYTEST_EXIT: ${{ steps.pytest.outputs.pytest_exit }}
        run: exit "$PYTEST_EXIT"
