name: Native MSVC audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: Native audio MSVC build audit
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure hosted Visual Studio x64
        shell: pwsh
        run: cmake -S native/audio -B native/audio/build -G "Visual Studio 18 2026" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build native/audio/build --config Release --parallel

      - name: Require Python FFI DLL and exported API
        shell: pwsh
        run: |
          $dll = Get-ChildItem native/audio/build -Recurse -Filter samplebrain_audio.dll | Select-Object -First 1
          if (-not $dll) { throw "samplebrain_audio.dll was not produced by the repository CMake build" }
          Write-Host "DLL=$($dll.FullName)"
          python -c "import ctypes,sys; lib=ctypes.WinDLL(sys.argv[1]); names=['sb_engine_open','sb_engine_start','sb_engine_stop','sb_engine_close','sb_voice_create','sb_voice_remove','sb_voice_schedule_start','sb_voice_stop','sb_voice_set_rate','sb_engine_snapshot','sb_recording_start','sb_recording_stop']; missing=[n for n in names if not hasattr(lib,n)]; assert not missing, f'missing exports: {missing}'; print('FFI exports OK:', ', '.join(names))" $dll.FullName

      - name: Run native CTest
        shell: pwsh
        run: ctest --test-dir native/audio/build -C Release --output-on-failure
