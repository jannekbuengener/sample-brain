[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-brain"
version = "0.1.0"
description = "Local-first sample library intelligence toolkit for producers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa==0.11.0",
    "numpy>=2.5,<3",
    "PyYAML>=6.0.3,<7",
    "scipy>=1.18,<2",
    "soundfile>=0.14,<0.15",
    "SQLAlchemy>=2.0.52,<3",
    "tqdm>=4.70,<5",
]

[project.scripts]
sample-brain = "src.cli:main"

[project.optional-dependencies]
clap = [
    "torch",
    "transformers>=4.35",
]
vec = [
    "sqlite-vec==0.1.9",
]
stems = [
    "audio-separator[cpu]==0.44.5",
]
beatgrid = [
    "beat-this==1.1.0",
]

[tool.setuptools]
packages = ["src"]
