[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-brain"
version = "0.1.0"
description = "Local-first sample library intelligence toolkit for producers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa==1.0.0",
    "numpy>=2.5,<3",
    "PyYAML>=6.0.3,<7",
    "scipy>=1.18,<2",
    "soundfile>=0.14,<0.15",
    "sample-brain-analysis @ https://github.com/jannekbuengener/sample-brain-analysis/releases/download/v0.1.2/sample_brain_analysis-0.1.2-py3-none-any.whl#sha256=ca2b168d9724adfc7254650eb7d40bea99deb815341685a7b661949a0ec5b61d",
    "SQLAlchemy>=2.0.52,<3",
    "tqdm>=4.70,<5",
]

[project.scripts]
sample-brain = "src.cli:main"

[project.optional-dependencies]
clap = [
    "torch==2.14.0",
    "transformers==5.20.2",
]
vec = [
    "sqlite-vec==0.1.9",
]
stems = [
    "audio-separator[cpu]==0.47.1",
]
beatgrid = [
    "beat-this==1.1.0",
]
qtquick = [
    "PySide6>=6.8,<6.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# First adoption is deliberately narrow: fatal/invalid Python constructs only.
# Broader existing lint debt is tracked separately from the CI policy rollout.
select = ["F63", "F7"]
